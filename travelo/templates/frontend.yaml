apiVersion: v1
kind: Service
metadata:
  name: travelo-frontend
spec:
  selector:
    app: travelo-frontend
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelo-frontend
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: travelo-frontend
  template:
    metadata:
      labels:
        app: travelo-frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.images.frontend }}
          ports:
            - containerPort: 80
