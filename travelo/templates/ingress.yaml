apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travelo-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.frontendHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: travelo-frontend
                port:
                  number: 80
    - host: {{ .Values.ingress.backendHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: travelo-backend
                port:
                  number: 8080
