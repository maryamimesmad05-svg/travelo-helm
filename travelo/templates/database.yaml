apiVersion: v1
kind: Secret
metadata:
  name: travelo-db-secret
type: Opaque
data:
  username: {{ .Values.database.username | b64enc }}
  password: {{ .Values.database.password | b64enc }}
---
apiVersion: v1
kind: Service
metadata:
  name: travelo-database
spec:
  clusterIP: None
  selector:
    app: travelo-database
  ports:
    - port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: travelo-database
spec:
  replicas: 1
  serviceName: travelo-database
  selector:
    matchLabels:
      app: travelo-database
  template:
    metadata:
      labels:
        app: travelo-database
    spec:
      containers:
        - name: mysql
          image: {{ .Values.images.database }}
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelo-db-secret
                  key: password
            - name: MYSQL_DATABASE
              value: {{ .Values.database.name }}
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.database.storage }}
