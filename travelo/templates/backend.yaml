apiVersion: v1
kind: ConfigMap
metadata:
  name: travelo-backend-conf
data:
  SPRING_DATASOURCE_URL: "jdbc:mysql://travelo-database:3306/{{ .Values.database.name }}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
---
apiVersion: v1
kind: Service
metadata:
  name: travelo-backend
spec:
  selector:
    app: travelo-backend
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelo-backend
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: travelo-backend
  template:
    metadata:
      labels:
        app: travelo-backend
    spec:
      initContainers:
        - name: wait-for-database
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z travelo-database 3306; do sleep 3; done"]
      containers:
        - name: backend
          image: {{ .Values.images.backend }}
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: travelo-backend-conf
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: travelo-db-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelo-db-secret
                  key: password
